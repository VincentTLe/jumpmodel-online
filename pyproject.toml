[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jm-online"
version = "0.1.0"
description = "Lightweight streaming inference and label-free latency-churn penalty calibration for Statistical Jump Models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tan Le" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
compat = ["jumpmodels>=0.1.1"]
dev = ["pytest>=8.0", "matplotlib>=3.7", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
